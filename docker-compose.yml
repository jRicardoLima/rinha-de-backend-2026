services:
  haproxy:
    image: haproxy:3.0-alpine
    container_name: rinha-haproxy
    ports:
      - "9999:9999"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
    cpus: "0.10"
    mem_limit: 30m
    restart: unless-stopped
    networks:
      - rinha-net

  api1:
    image: jotaricardolima/rinha-backend-2026:v1
    container_name: rinha-api1
    environment:
      APP_NAME: "rinha_backend_2026"
      APP_ENV: "development"
      APP_PORT: "8080"
      APP_ADDRESS: "0.0.0.0"
      LOG_LEVEL: "info"
      PORT: "8080"
      INSTANCE_NAME: "api1"
    ports:
      - "8081:8080"
    expose:
      - "8080"
    cpus: "0.45"
    mem_limit: 160m
    restart: unless-stopped
    networks:
      - rinha-net

  api2:
    image: jotaricardolima/rinha-backend-2026:v1
    container_name: rinha-api2
    environment:
      APP_NAME: "rinha_backend_2026"
      APP_ENV: "development"
      APP_PORT: "8080"
      APP_ADDRESS: "0.0.0.0"
      LOG_LEVEL: "info"
      PORT: "8080"
      INSTANCE_NAME: "api2"
    ports:
      - "8082:8080"
    expose:
      - "8080"
    cpus: "0.45"
    mem_limit: 160m
    restart: unless-stopped
    networks:
      - rinha-net

networks:
  rinha-net:
    driver: bridge