global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 1s
    timeout client 3s
    timeout server 3s

frontend http_front
    bind *:9999
    default_backend api_back

backend api_back
    balance roundrobin
    option httpchk
    http-check send meth GET uri /ready
    http-check expect status 200

    server api1 api1:8080 check
    server api2 api2:8080 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
